name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Supersede in-flight runs for the same ref; a force-push shouldn't queue work.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the supported floor; 3.14 is what the app is developed against.
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # conftest.py puts backend/ on sys.path and redirects OPENCYTO_DATA_DIR
        # to a temp dir, so the suite never touches a real ~/.freecyto.
        run: python -m pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx vite build

      - name: Verify built assets use relative paths
        # Electron loads dist/index.html over file:// in a packaged build, so an
        # absolute "/assets/..." href would 404. Guards vite.config.ts `base: "./"`.
        run: |
          if grep -q 'src="/assets/' dist/index.html; then
            echo "::error::dist/index.html uses absolute asset paths; packaged Electron build would fail to load."
            exit 1
          fi
          echo "OK: assets are referenced relatively."
